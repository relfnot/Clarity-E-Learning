<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="header-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="header-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="header-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="header-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <text x="800" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">ENTITY RELATIONSHIP DIAGRAM (ERD) — CLARITY E-LEARNING</text>
  <text x="800" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">Desain Skema Database Terintegrasi (Tahap F3 · 13–16 November 2026)</text>

  <!-- USERS -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="240" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="38" rx="8" fill="url(#header-blue)"/>
    <rect y="30" width="240" height="8" fill="url(#header-blue)"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">users</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#38bdf8">UK</tspan>  nim_nip : varchar(50)</text>
      <text y="40">    name : varchar(150)</text>
      <text y="60"><tspan fill="#38bdf8">UK</tspan>  email : varchar(150)</text>
      <text y="80">    password_hash : varchar</text>
      <text y="100">    role : enum(mhs, dsn)</text>
      <text y="120">    program_studi : varchar</text>
      <text y="140">    semester : int</text>
      <text y="160">    department : varchar</text>
      <text y="180">    initials : varchar(10)</text>
      <text y="200">    created_at : timestamp</text>
    </g>
  </g>

  <!-- USER GAMIFICATION -->
  <g transform="translate(50, 420)" filter="url(#shadow)">
    <rect width="240" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="38" rx="8" fill="url(#header-amber)"/>
    <rect y="30" width="240" height="8" fill="url(#header-amber)"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">user_gamification</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK,FK</tspan> user_id : bigint</text>
      <text y="20">       level : int</text>
      <text y="40">       title : varchar(100)</text>
      <text y="60">       xp : int</text>
      <text y="80">       rank_in_class : int</text>
    </g>
  </g>

  <!-- COURSES -->
  <g transform="translate(350, 110)" filter="url(#shadow)">
    <rect width="240" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="38" rx="8" fill="url(#header-blue)"/>
    <rect y="30" width="240" height="8" fill="url(#header-blue)"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">courses</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#38bdf8">UK</tspan>  code : varchar(50)</text>
      <text y="40">    name : varchar(150)</text>
      <text y="60">    description : text</text>
      <text y="80">    semester : varchar(50)</text>
      <text y="100">    credits : int</text>
      <text y="120"><tspan fill="#a855f7">FK</tspan>  lecturer_id : bigint</text>
      <text y="140">    day : varchar(20)</text>
      <text y="160">    start_time : time</text>
      <text y="180">    end_time : time</text>
      <text y="200">    room : varchar(50)</text>
    </g>
  </g>

  <!-- COURSE ENROLLMENTS -->
  <g transform="translate(200, 420)" filter="url(#shadow)">
    <rect width="240" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="38" rx="8" fill="url(#header-blue)"/>
    <rect y="30" width="240" height="8" fill="url(#header-blue)"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">course_enrollments</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  course_id : bigint</text>
      <text y="40"><tspan fill="#a855f7">FK</tspan>  student_id : bigint</text>
      <text y="60">    enrolled_at : timestamp</text>
    </g>
  </g>

  <!-- MEETINGS -->
  <g transform="translate(650, 110)" filter="url(#shadow)">
    <rect width="240" height="170" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="38" rx="8" fill="url(#header-blue)"/>
    <rect y="30" width="240" height="8" fill="url(#header-blue)"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">meetings</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  course_id : bigint</text>
      <text y="40">    meeting_number : int</text>
      <text y="60">    title : varchar(150)</text>
      <text y="80">    date : date</text>
      <text y="100">    description : text</text>
    </g>
  </g>

  <!-- MATERIALS -->
  <g transform="translate(650, 310)" filter="url(#shadow)">
    <rect width="240" height="170" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="38" rx="8" fill="url(#header-blue)"/>
    <rect y="30" width="240" height="8" fill="url(#header-blue)"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">materials</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  course_id : bigint</text>
      <text y="40"><tspan fill="#a855f7">FK</tspan>  meeting_id : bigint</text>
      <text y="60">    title : varchar(200)</text>
      <text y="80">    type : enum(pdf, video)</text>
      <text y="100">    file_url : text</text>
    </g>
  </g>

  <!-- ATTENDANCE SESSIONS -->
  <g transform="translate(650, 510)" filter="url(#shadow)">
    <rect width="240" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="38" rx="8" fill="url(#header-blue)"/>
    <rect y="30" width="240" height="8" fill="url(#header-blue)"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">attendance_sessions</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  course_id : bigint</text>
      <text y="40"><tspan fill="#a855f7">FK</tspan>  meeting_id : bigint</text>
      <text y="60">    opened_at : timestamp</text>
      <text y="80">    closed_at : timestamp</text>
      <text y="100">    passcode : varchar(20)</text>
      <text y="120">    status : open | closed</text>
    </g>
  </g>

  <!-- ASSIGNMENTS -->
  <g transform="translate(950, 110)" filter="url(#shadow)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="38" rx="8" fill="url(#header-purple)"/>
    <rect y="30" width="250" height="8" fill="url(#header-purple)"/>
    <text x="125" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">assignments</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  course_id : bigint</text>
      <text y="40"><tspan fill="#a855f7">FK</tspan>  meeting_id : bigint</text>
      <text y="60">    title : varchar(200)</text>
      <text y="80">    deadline : timestamp</text>
      <text y="100">    submission_type : varchar</text>
      <text y="120">    max_points : int</text>
      <text y="140">    weight_percent : decimal</text>
      <text y="160">    created_at : timestamp</text>
    </g>
  </g>

  <!-- ASSIGNMENT SUBMISSIONS -->
  <g transform="translate(950, 370)" filter="url(#shadow)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="38" rx="8" fill="url(#header-purple)"/>
    <rect y="30" width="250" height="8" fill="url(#header-purple)"/>
    <text x="125" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">assignment_submissions</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  assignment_id : bigint</text>
      <text y="40"><tspan fill="#a855f7">FK</tspan>  student_id : bigint</text>
      <text y="60">    submitted_at : timestamp</text>
      <text y="80">    file_url / link : text</text>
      <text y="100">    status : on_time | late</text>
      <text y="120">    grade : decimal</text>
      <text y="140">    feedback : text</text>
      <text y="160"><tspan fill="#a855f7">FK</tspan>  graded_by : bigint</text>
    </g>
  </g>

  <!-- QUIZZES -->
  <g transform="translate(1250, 110)" filter="url(#shadow)">
    <rect width="260" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="260" height="38" rx="8" fill="url(#header-purple)"/>
    <rect y="30" width="260" height="8" fill="url(#header-purple)"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">quizzes</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  course_id : bigint</text>
      <text y="40"><tspan fill="#a855f7">FK</tspan>  meeting_id : bigint</text>
      <text y="60">    title : varchar(200)</text>
      <text y="80">    duration_minutes : int</text>
      <text y="100">    max_attempts : int</text>
      <text y="120">    start_time : timestamp</text>
      <text y="140">    end_time : timestamp</text>
      <text y="160">    weight_percent : decimal</text>
    </g>
  </g>

  <!-- QUIZ ATTEMPTS -->
  <g transform="translate(1250, 370)" filter="url(#shadow)">
    <rect width="260" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="260" height="38" rx="8" fill="url(#header-purple)"/>
    <rect y="30" width="260" height="8" fill="url(#header-purple)"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">quiz_attempts</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  quiz_id : bigint</text>
      <text y="40"><tspan fill="#a855f7">FK</tspan>  student_id : bigint</text>
      <text y="60">    attempt_number : int</text>
      <text y="80">    started_at : timestamp</text>
      <text y="100">    finished_at : timestamp</text>
      <text y="120">    total_score : decimal</text>
      <text y="140">    status : in_progress | done</text>
    </g>
  </g>

  <!-- XP TRANSACTIONS -->
  <g transform="translate(50, 680)" filter="url(#shadow)">
    <rect width="240" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="38" rx="8" fill="url(#header-amber)"/>
    <rect y="30" width="240" height="8" fill="url(#header-amber)"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">xp_transactions</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  user_id : bigint</text>
      <text y="40">    source_type : varchar</text>
      <text y="60">    source_id : bigint</text>
      <text y="80">    xp_amount : int</text>
      <text y="100">    description : varchar</text>
      <text y="120">    created_at : timestamp</text>
    </g>
  </g>

  <!-- NOTIFICATIONS -->
  <g transform="translate(340, 680)" filter="url(#shadow)">
    <rect width="240" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="38" rx="8" fill="url(#header-emerald)"/>
    <rect y="30" width="240" height="8" fill="url(#header-emerald)"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">notifications</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  user_id : bigint</text>
      <text y="40">    title : varchar(150)</text>
      <text y="60">    message : text</text>
      <text y="80">    type : reminder | grade</text>
      <text y="100">    is_read : boolean</text>
      <text y="120">    created_at : timestamp</text>
    </g>
  </g>

  <!-- COURSE FINAL GRADES -->
  <g transform="translate(650, 730)" filter="url(#shadow)">
    <rect width="250" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="38" rx="8" fill="url(#header-emerald)"/>
    <rect y="30" width="250" height="8" fill="url(#header-emerald)"/>
    <text x="125" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">course_final_grades</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  course_id : bigint</text>
      <text y="40"><tspan fill="#a855f7">FK</tspan>  student_id : bigint</text>
      <text y="60">    assignments_avg : decimal</text>
      <text y="80">    quizzes_avg : decimal</text>
      <text y="100">    attendance_pct : decimal</text>
      <text y="120">    final_score : decimal</text>
      <text y="140">    progress_percent : int</text>
    </g>
  </g>

  <!-- CHAT MESSAGES -->
  <g transform="translate(950, 680)" filter="url(#shadow)">
    <rect width="250" height="170" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="38" rx="8" fill="url(#header-emerald)"/>
    <rect y="30" width="250" height="8" fill="url(#header-emerald)"/>
    <text x="125" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">chat_messages</text>
    <g transform="translate(12, 58)" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#f59e0b" font-weight="bold">PK</tspan>  id : bigint</text>
      <text y="20"><tspan fill="#a855f7">FK</tspan>  room_id : bigint</text>
      <text y="40"><tspan fill="#a855f7">FK</tspan>  sender_id : bigint</text>
      <text y="60">    message : text</text>
      <text y="80">    sent_at : timestamp</text>
    </g>
  </g>

  <!-- LEGEND -->
  <g transform="translate(50, 970)">
    <rect width="1500" height="55" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="32" fill="#94a3b8" font-size="13" font-weight="bold">MODUL LEGEND:</text>
    
    <rect x=\"170\" y=\"20\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#3b82f6\"/>
    <text x=\"192\" y=\"32\" fill=\"#e2e8f0\" font-size=\"12\">Akademik Inti (Rizky)</text>

    <rect x=\"390\" y=\"20\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#8b5cf6\"/>
    <text x=\"412\" y=\"32\" fill=\"#e2e8f0\" font-size=\"12\">Tugas &amp; Quiz (Rizky &amp; Gaby)</text>

    <rect x=\"650\" y=\"20\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#f59e0b\"/>
    <text x=\"672\" y=\"32\" fill=\"#e2e8f0\" font-size=\"12\">Gamifikasi (Gaby)</text>

    <rect x=\"860\" y=\"20\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#10b981\"/>
    <text x=\"882\" y=\"32\" fill=\"#e2e8f0\" font-size=\"12\">Penilaian, Notifikasi &amp; Chat (Gaby)</text>
  </g>

</svg>

