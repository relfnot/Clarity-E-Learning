<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarity E-Learning — Dokumentasi & Kontrak REST API (OpenAPI 3.0)</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    :root {
      --bg-header: #0f172a;
      --border-header: #1e293b;
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .clarity-topbar {
      background: var(--bg-header);
      color: var(--text-main);
      border-bottom: 1px solid var(--border-header);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .clarity-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .clarity-badge {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .clarity-brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .clarity-brand span {
      color: var(--text-muted);
      font-size: 13px;
    }
    .clarity-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .clarity-links a {
      color: #e2e8f0;
      text-decoration: none;
      font-size: 13px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .clarity-links a:hover {
      background: #334155;
      border-color: #475569;
    }
    .swagger-ui .topbar {
      display: none;
    }
  </style>
</head>
<body>
  <header class="clarity-topbar">
    <div class="clarity-brand">
      <span class="clarity-badge">TAHAP F5 · v1.0.0</span>
      <div>
        <h1>Clarity E-Learning — Kontrak REST API (`/api/v1`)</h1>
        <span>Single Source of Truth · Frontend (Matthew) &amp; Backend (Rizky, Gaby)</span>
      </div>
    </div>
    <nav class="clarity-links" aria-label="Tautan Dokumentasi">
      <a href="./openapi.yaml" target="_blank" rel="noopener">Unduh openapi.yaml</a>
      <a href="./README.md" target="_blank" rel="noopener">Aturan Kontrak (README)</a>
      <a href="../mockups/index.html">Mockup UI (F4)</a>
      <a href="../../erd/erd.svg" target="_blank" rel="noopener">Diagram ERD (F3)</a>
    </nav>
  </header>

  <main id="swagger-ui"></main>

  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.addEventListener('load', function () {
      window.ui = SwaggerUIBundle({
        url: './openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: 1,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: 'StandaloneLayout'
      });
    });
  </script>
</body>
</html>
