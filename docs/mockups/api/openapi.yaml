# ==============================================================================
# COMPONENTS (SCHEMAS, ENUMS, PARAMETERS, RESPONSES, SECURITY)
# ==============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Masukkan token JWT HS256 yang diperoleh dari `POST /api/v1/auth/login`.
        Masa berlaku token adalah 8 jam (`sub`, `role`, `exp`).

  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      description: ID numerik resource
      schema:
        type: integer
        minimum: 1
        example: 1
    PageParam:
      name: page
      in: query
      required: false
      description: Nomor halaman pagination (mulai dari 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: per_page
      in: query
      required: false
      description: Jumlah item per halaman (default 20, maksimal 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    UnauthenticatedError:
      description: Token autentikasi tidak dikirim, tidak valid, atau sudah kedaluwarsa (`401`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "UNAUTHENTICATED"
              message: "Token autentikasi tidak ditemukan, tidak valid, atau sudah kedaluwarsa."
              details: {}
    ForbiddenError:
      description: Pengguna tidak memiliki peran yang sesuai atau bukan peserta/pengampu mata kuliah (`403`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "FORBIDDEN"
              message: "Anda tidak memiliki izin akses untuk resource ini."
              details: {}
    NotFoundError:
      description: Resource tidak ditemukan (`404`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "NOT_FOUND"
              message: "Data yang diminta tidak ditemukan."
              details: {}
    ConflictError:
      description: Konflik aksi ganda seperti presensi duplikat atau melebihi batas percobaan quiz (`409`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "CONFLICT"
              message: "Aksi ini sudah pernah dilakukan dan tidak dapat diulang."
              details: {}
    ValidationError:
      description: Validasi field gagal (`422`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Data yang dikirim tidak lolos validasi."
              details:
                field_name:
                  - "Pesan kesalahan spesifik pada field ini."
    RateLimitedError:
      description: Terlalu banyak percobaan gagal dalam jendela waktu (`429`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "RATE_LIMITED"
              message: "Terlalu banyak percobaan login gagal (maks 5 kali / 15 menit). Silakan coba lagi nanti."
              details:
                retry_after_seconds: 900

  schemas:
    # --- ENUMS (Didefinisikan sekali sesuai bagian 6 PRD F5) ---
    RoleEnum:
      type: string
      enum: [mahasiswa, dosen]
      example: "mahasiswa"

    SubmissionStatusEnum:
      type: string
      enum: [belum, tepat_waktu, terlambat, dinilai]
      example: "tepat_waktu"

    AttendanceStatusEnum:
      type: string
      enum: [hadir, izin, sakit, alpa]
      example: "hadir"

    QuestionTypeEnum:
      type: string
      enum: [pg, esai]
      example: "pg"

    UrgencyEnum:
      type: string
      enum: [j3, h1, h3, normal]
      description: "`j3` (<= 3 jam), `h1` (<= 24 jam), `h3` (<= 3 hari), `normal` (> 3 hari)"
      example: "h1"

    # --- CORE SCHEMAS ---
    User:
      type: object
      required: [id, nim_nip, name, email, role]
      properties:
        id:
          type: integer
          example: 101
