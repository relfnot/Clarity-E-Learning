openapi: 3.0.3
info:
  title: Clarity E-Learning — Kontrak REST API
  version: 1.0.0
  description: |
    Spesifikasi kontrak REST API untuk **Clarity E-Learning** (Universitas Katolik Soegijapranata).
    Dokumen ini adalah *Single Source of Truth* (Tahap F5) yang menghubungkan Frontend (**Matthew**) dengan Backend 1 (**Rizky**) dan Backend 2 (**Gaby**).

    ### Konvensi Wajib
    - **Base Path:** `/api/v1`
    - **Autentikasi:** JWT HS256 (`Authorization: Bearer <token>`), berlaku 8 jam (`sub`, `role`, `exp`).
    - **Format Waktu:** ISO 8601 dengan offset WIB (`Asia/Jakarta`), misal `2026-12-05T23:59:00+07:00`.
    - **Penamaan Field:** Seluruh field JSON dan query parameter menggunakan `snake_case`.
    - **Envelope Sukses:** `{ "data": ..., "meta": { ... } }`
    - **Envelope Error:** `{ "error": { "code": "...", "message": "...", "details": { ... } } }`

    ### Aturan Bisnis Utama
    1. **Keterlambatan Tugas (`is_late`):** Dihitung server (`submitted_at > deadline`). Keterlambatan **tidak** mengurangi XP dasar, hanya tanpa bonus XP tepat waktu.
    2. **Presensi:** Hanya dapat dilakukan saat sesi berstatus `open` dan maksimal **1 kali** per pertemuan per mahasiswa (duplikat mengembalikan `409 CONFLICT`).
    3. **Quiz:** Hanya dapat dimulai dalam rentang `open_at` s/d `close_at`, maksimal sebanyak `max_attempts` (lebih dari itu `409 CONFLICT`), auto-submit saat `expires_at`, dan soal tidak dibocorkan pada detail quiz sebelum percobaan dimulai.
    4. **Nilai Akhir:** $\text{Nilai Akhir} = \sum (\text{komponen} \times \text{bobot} / 100)$, di mana total bobot seluruh komponen wajib tepat **100**.
    5. **Leaderboard & Privasi:** Mahasiswa dengan `leaderboard_anonymous = true` ditampilkan sebagai `"Anonim"`; mahasiswa dengan `leaderboard_hidden = true` disembunyikan dari daftar.
    6. **Reminder Tugas:** Notifikasi otomatis dikirim pada H-3, H-1, dan H-3 jam (`J3`) tanpa pengiriman ganda (dicatat di `reminder_log`).
  contact:
    name: Tim Pengembang Clarity E-Learning (Rizky, Gaby, Matthew)

servers:
  - url: /api/v1
    description: Server API Lokal (Laragon Apache Rewrite)
  - url: http://localhost/elearning/public/api/v1
    description: Laragon Subfolder Default

tags:
  - name: Auth
    description: "Autentikasi JWT HS256 & sesi pengguna (PIC: Rizky · P0)"
  - name: Akun
    description: "Pengaturan profil, password, dan preferensi privasi/hemat data (PIC: Rizky & Gaby · P1)"
  - name: Mata Kuliah
    description: "Daftar dan detail mata kuliah yang diikuti/diampu (PIC: Rizky · P0/P1)"
  - name: Peserta
    description: "Daftar peserta kelas & pengelolaan enrollment (PIC: Rizky · P0/P1)"
  - name: Pertemuan
    description: "Jadwal dan daftar pertemuan perkuliahan (PIC: Rizky · P0)"
  - name: Materi
    description: "Modul materi perkuliahan berupa berkas atau tautan video (PIC: Rizky · P0)"
  - name: Tugas & Pengumpulan
    description: "Manajemen tugas, pengumpulan berkas/tautan, dan penilaian (PIC: Rizky & Gaby · P0)"
  - name: Presensi
    description: "Sesi presensi pertemuan, check-in mahasiswa, dan rekap kehadiran (PIC: Rizky · P0/P1)"
  - name: Kalender
    description: "Agenda terpadu kuliah, batas waktu tugas, dan jadwal quiz (PIC: Rizky · P0)"
  - name: Quiz
    description: "Manajemen quiz, bank soal PG/Esai, percobaan berwaktu, dan penilaian otomatis (PIC: Gaby · P0/P1)"
  - name: Nilai & Progress
    description: "Rekap nilai komponen, bobot penilaian, dan persentase kemajuan belajar (PIC: Gaby · P0)"
  - name: Dashboard & Reminder
    description: "Ringkasan terpadu halaman utama mahasiswa, dosen, dan pengingat tugas (PIC: Gaby · P0/P1/P2)"
  - name: Notifikasi
    description: "Pusat notifikasi pengguna dan siaran pengumuman kelas (PIC: Gaby · P0)"
  - name: Chat
    description: "Diskusi grup mata kuliah dan pesan langsung berbasis REST polling (PIC: Gaby · P1)"
  - name: Gamifikasi
    description: "Profil XP, level, badge, dan papan peringkat kelas (PIC: Gaby · P1)"

security:
  - bearerAuth: []

paths:
  # ============================================================================
  # 1. AUTH & AKUN
  # ============================================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Login menggunakan NIM/NIP atau Email + Password (P0)
      description: |
        Mengautentikasi mahasiswa atau dosen dan mengembalikan token JWT HS256 yang berlaku selama **8 jam**.
        Dibatasi oleh rate limiter maksimal **5 percobaan gagal per 15 menit** per akun + IP (`429 RATE_LIMITED`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: NIM mahasiswa, NIP dosen, atau alamat email kampus.
                  example: "24.N1.0026"
                password:
                  type: string
                  format: password
                  example: "RahasiaKampus123!"
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [token, token_type, expires_in, user]
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEwMSwicm9sZSI6Im1haGFzaXN3YSIsImlhdCI6MTc5NjQ0MjAwMCwiZXhwIjoxNzk2NDcwODAwfQ.dummy_signature"
                      token_type:
                        type: string
                        example: "Bearer"
                      expires_in:
                        type: integer
                        example: 28800
                      expires_at:
                        type: string
                        format: date-time
                        example: "2026-12-05T18:00:00+07:00"
                      user:
                        $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    example: {}
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Ambil profil pengguna yang sedang login (P0)
      description: Mengembalikan profil lengkap pengguna berdasarkan klaim `sub` pada token JWT.
      responses:
        '200':
          description: Profil pengguna saat ini
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    example: {}
        '401':
          $ref: '#/components/responses/UnauthenticatedError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout sesi saat ini (P0)
      description: Mengakhiri sesi pengguna (klien menghapus token JWT dari storage browser).
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Berhasil keluar dari sesi."
                  meta:
                    type: object
                    example: {}
        '401':
          $ref: '#/components/responses/UnauthenticatedError'

  /me/profile:
    patch:
      tags: [Akun]
      summary: Perbarui profil pengguna saat ini (P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Dimas Rizky Fajar Pamungkas"
                email:
                  type: string
                  format: email
                  example: "24n10026@student.unika.ac.id"
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/password:
    patch:
      tags: [Akun]
      summary: Ubah password akun (P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Password berhasil diperbarui."
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/settings:
    get:
      tags: [Akun]
      summary: Ambil pengaturan privasi leaderboard & hemat data (P1)
      responses:
        '200':
          description: Pengaturan pengguna
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserSettings'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
    put:
      tags: [Akun]
      summary: Simpan pengaturan privasi leaderboard & hemat data (P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: Pengaturan berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserSettings'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ============================================================================
  # 2. MATA KULIAH, PESERTA, PERTEMUAN & MATERI
  # ============================================================================
  /courses:
    get:
      tags: [Mata Kuliah]
      summary: Daftar mata kuliah milik pengguna saat ini (P0)
      description: |
        - Untuk **mahasiswa**: hanya mengembalikan mata kuliah yang diikuti (`enrollments`).
        - Untuk **dosen**: hanya mengembalikan mata kuliah yang diampu (`lecturer_id = user.id`).
      parameters:
        - name: semester
          in: query
          schema:
            type: string
          example: "Ganjil 2026/2027"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Daftar mata kuliah
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
    post:
      tags: [Mata Kuliah]
      summary: Buat mata kuliah baru (Khusus Dosen · P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
      responses:
        '201':
          description: Mata kuliah berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Course'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /courses/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Mata Kuliah]
      summary: Detail mata kuliah, dosen pengampu & jadwal (P0)
      responses:
        '200':
          description: Detail mata kuliah
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Course'
                  meta:
                    type: object
                    example: {}
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Mata Kuliah]
      summary: Ubah informasi mata kuliah yang diampu (Khusus Dosen · P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
      responses:
        '200':
          description: Mata kuliah berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Course'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /courses/{id}/participants:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
    get:
      tags: [Peserta]
      summary: Daftar peserta mata kuliah (P0)
      responses:
        '200':
          description: Daftar peserta kelas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /courses/{id}/enrollments:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      tags: [Peserta]
      summary: Daftarkan mahasiswa ke mata kuliah berdasarkan NIM (Khusus Dosen · P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nim_nip]
              properties:
                nim_nip:
                  type: string
                  example: "24.N1.0026"
      responses:
        '201':
          description: Mahasiswa berhasil didaftarkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /courses/{id}/enrollments/{user_id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [Peserta]
      summary: Keluarkan mahasiswa dari mata kuliah (Khusus Dosen · P1)
      responses:
        '204':
          description: Mahasiswa berhasil dikeluarkan dari kelas
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /courses/{id}/meetings:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Pertemuan]
      summary: Daftar pertemuan pada mata kuliah (P0)
      responses:
        '200':
          description: Daftar pertemuan berurutan
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Meeting'
                  meta:
                    type: object
                    example: {}
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Pertemuan]
      summary: Buat pertemuan baru (Khusus Dosen · P0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, title, meeting_date]
              properties:
                number:
                  type: integer
                  example: 11
                title:
                  type: string
                  example: "Optimasi Query & Caching Sederhana"
                description:
                  type: string
                  example: "Pembahasan indeks MySQL dan optimasi endpoint dashboard."
                meeting_date:
                  type: string
                  format: date
                  example: "2026-12-12"
      responses:
        '201':
          description: Pertemuan berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Meeting'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /courses/{id}/materials:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Materi]
      summary: Daftar materi perkuliahan pada mata kuliah (P0)
      parameters:
        - name: meeting_id
          in: query
          schema:
            type: integer
          description: Filter materi berdasarkan ID pertemuan
      responses:
        '200':
          description: Daftar materi perkuliahan
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Material'
                  meta:
                    type: object
                    example: {}
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Materi]
      summary: Unggah materi berkas atau tautan baru (Khusus Dosen · P0)
      description: |
        Untuk `type=file`, kirimkan `multipart/form-data` dengan field `file` (maks 10 MB; tipe `pdf, doc, docx, ppt, pptx, xls, xlsx, zip, jpg, png, txt`).
        Untuk video, gunakan `type=link` dan isi field `url`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meeting_id, title, type]
              properties:
                meeting_id:
                  type: integer
                  example: 3
                title:
                  type: string
                  example: "Panduan Upload Aman & Validasi MIME"
                type:
                  type: string
                  enum: [file, link]
                  example: "file"
                file:
                  type: string
                  format: binary
                url:
                  type: string
                  format: uri
                  nullable: true
      responses:
        '201':
          description: Materi berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Material'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /materials/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    put:
      tags: [Materi]
      summary: Ubah metadata materi (Khusus Dosen · P0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                meeting_id:
                  type: integer
                title:
                  type: string
                url:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Materi berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Material'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Materi]
      summary: Hapus materi perkuliahan (Khusus Dosen · P0)
      responses:
        '204':
          description: Materi berhasil dihapus
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /materials/{id}/download:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Materi]
      summary: Unduh berkas materi perkuliahan (P0)
      description: Mengalirkan berkas dari `storage/uploads` setelah memverifikasi pengguna adalah peserta/pengampu mata kuliah.
      responses:
        '200':
          description: Stream berkas materi
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ============================================================================
  # 3. TUGAS, PENGUMPULAN & PENILAIAN
  # ============================================================================
  /courses/{id}/assignments:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Tugas & Pengumpulan]
      summary: Daftar tugas pada mata kuliah (P0)
      description: Bila dipanggil oleh mahasiswa, setiap item menyertakan ringkasan status pengumpulan miliknya (`my_submission`).
      responses:
        '200':
          description: Daftar tugas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
                  meta:
                    type: object
                    example: {}
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Tugas & Pengumpulan]
      summary: Buat tugas baru pada mata kuliah (Khusus Dosen · P0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentInput'
      responses:
        '201':
          description: Tugas berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Assignment'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
