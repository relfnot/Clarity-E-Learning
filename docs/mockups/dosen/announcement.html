<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirim Pengumuman — Clarity E-Learning</title>
  <link rel="stylesheet" href="../assets/css/tokens.css?v=2">
  <link rel="stylesheet" href="../assets/css/components.css?v=2">
</head>
<body data-role="dosen" data-base=".." data-page="announcement" data-title="Kirim Pengumuman & Notifikasi" data-subtitle="Sebarkan pemberitahuan resmi ke seluruh peserta mata kuliah">
  <div id="page-content" class="stack">
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumb">
        <li><a href="dashboard.html">Dashboard Dosen</a></li>
        <li class="breadcrumb-sep" aria-hidden="true">/</li>
        <li class="breadcrumb-current">Kirim Pengumuman</li>
      </ol>
    </nav>

    <div class="grid grid-sidebar-right">
      <section class="card">
        <div class="card-header"><h1 class="card-title" style="font-size:var(--text-lg)">Buat Pengumuman Kelas</h1></div>
        <div class="card-body">
          <form id="announcement-form">
            <div class="form-group">
              <label class="form-label" for="ann-course">Target Mata Kuliah <span class="form-required">*</span></label>
              <select class="form-select" id="ann-course">
                <option>07228204 — MANAJEMEN PROYEK 07 (32 Mahasiswa)</option>
                <option>07228239 — TEKNOLOGI KEUANGAN 05 (35 Mahasiswa)</option>
                <option>07228203 — ETIKA PROFESI 07 (28 Mahasiswa)</option>
                <option>07228250 — KOTA CERDAS 03 (30 Mahasiswa)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="ann-title">Judul Pengumuman <span class="form-required">*</span></label>
              <input class="form-control" id="ann-title" type="text" placeholder="Contoh: Pengingat Pengumpulan Tugas 4 & Jadwal Quiz 2" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ann-body">Isi Pemberitahuan <span class="form-required">*</span></label>
              <textarea class="form-textarea" id="ann-body" rows="5" placeholder="Tulis informasi yang akan dikirim ke notifikasi mahasiswa..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Kirim Notifikasi ke Kelas</button>
          </form>
        </div>
      </section>

      <aside class="card">
        <div class="card-header"><h2 class="card-title">Riwayat Terkirim</h2></div>
        <div class="card-body list-group">
          <div class="list-item">
            <div>
              <div class="text-xs text-muted">5 Des 2026 · 07:55 WIB · 07228204</div>
              <div class="text-sm font-semibold">Sesi Presensi Pertemuan 10 Dibuka</div>
              <div class="text-xs text-secondary">Terkirim ke 32 mahasiswa.</div>
            </div>
          </div>
          <div class="list-item">
            <div>
              <div class="text-xs text-muted">3 Des 2026 · 11:00 WIB · 07228204</div>
              <div class="text-sm font-semibold">Quiz 2 Dijadwalkan 5–7 Des</div>
              <div class="text-xs text-secondary">Terkirim ke 32 mahasiswa.</div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="../assets/js/mock-data.js?v=2"></script>
  <script src="../assets/js/layout.js?v=2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var form = document.getElementById('announcement-form');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (window.ClarityUI) ClarityUI.showToast('Pengumuman berhasil dikirim ke 32 mahasiswa!', 'success');
        });
      }
    });
  </script>
</body>
</html>
